function calcStreak(days){var s=0;var cur=new Date();if(!days[fmt(cur)])cur.setDate(cur.getDate()-1);while(days[fmt(cur)]){s++;cur.setDate(cur.getDate()-1);}return s;}
function isRight(q,g){return q.type==="number"?(g!==""&&parseInt(g,10)===parseInt(q.answer,10)):g===q.answer;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function mmss(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function colFor(p){return p>=90?"#0a7367":p>=70?"#22A45D":p>=40?"#7cc59a":"#f0a3a6";}
function sparkline(series){if(series.length<2)return"";var w=300,hh=150,pad=18;function xs(i){return pad+i*(w-2*pad)/(series.length-1);}function ys(v){return hh-pad-(v/100)*(hh-2*pad);}var pts=series.map(function(s,i){return xs(i)+","+ys(s.acc);}).join(" ");var dots=series.map(function(s,i){return'<circle cx="'+xs(i)+'" cy="'+ys(s.acc)+'" r="3" fill="#0E9384"/>';}).join("");return'<svg viewBox="0 0 '+w+' '+hh+'" width="100%" height="150"><polyline points="'+pts+'" fill="none" stroke="#0E9384" stroke-width="3"/>'+dots+'</svg>';}

 else if(a==="syncnow"){if(FAM_REF){try{pushCloud();FAM_REF.once("value").then(function(snap){var r=snap.val();if(r){data=mergeData(data,r);saveLocal();if(localBeatsRemote(r))pushCloud();}setSync("ok","");render();}).catch(function(e){setSync("error",(e&&e.code)?e.code:(e&&e.message)?e.message:"read blocked");render();});}catch(e){setSync("error",e&&e.message?e.message:"failed");render();}}else{render();}}
 else if(a==="switch")switchProfile(t.getAttribute("data-id"));
 else if(a==="start")startSession(t.getAttribute("data-bonus")==="1");
 else if(a==="review")reviewToday();
 else if(a==="speak")speakQuestion(q);
 else if(a==="key"){var g=S.answers[q.id]||"";if(g.length<3){S.answers[q.id]=g+t.getAttribute("data-k");render();}}
 else if(a==="clear"){S.answers[q.id]="";render();}
 else if(a==="del"){var g=S.answers[q.id]||"";S.answers[q.id]=g.slice(0,-1);render();}
 else if(a==="choice"){S.answers[q.id]=t.getAttribute("data-v");render();}
 else if(a==="nextq"){S.idx++;render();}
 else if(a==="prevq"){if(S.idx>0)S.idx--;render();}
 else if(a==="finish")finish();
 else if(a==="part"){var cat=t.getAttribute("data-cat"),opt=t.getAttribute("data-opt");var pp=P();var h=Object.assign({},pp.heroes[pp.heroIndex]);h[cat]=opt;pp.heroes[pp.heroIndex]=h;save();render();}
 else if(a==="selhero"){var pp=P();var i=parseInt(t.getAttribute("data-i"),10);if(i<pp.heroes.length){pp.heroIndex=i;save();render();}}
 else if(a==="addhero"){var pp=P();if(pp.heroes.length<teamSize(pp.points||0)){pp.heroes.push(Object.assign({},DEFAULT_HERO));pp.heroIndex=pp.heroes.length-1;save();render();}}
 else if(a==="herocat"){var k=t.getAttribute("data-cat");S.heroCat=(S.heroCat===k)?"":k;render();}
 else if(a==="level"){P().level=t.getAttribute("data-v");save();render();}
 else if(a==="depth"){P().depth=t.getAttribute("data-v");save();render();}
 else if(a==="stage"){S.newStage=t.getAttribute("data-v");render();}
 else if(a==="add")addProfile();
 else if(a==="delchild")deleteProfile(t.getAttribute("data-id"));
 else if(a==="reset")resetActive();
 else if(a==="calprev"){S.calOffset=(S.calOffset||0)-1;render();}
 else if(a==="calnext"){if((S.calOffset||0)<0){S.calOffset=(S.calOffset||0)+1;render();}}
}
function onChange(e){var t=e.target;if(!t.getAttribute)return;var a=t.getAttribute("data-act");if(a==="rename"){var v=t.value.trim();P().name=v||P().name;save();render();}else if(a==="hname"){var pp=P();var h=Object.assign({},pp.heroes[pp.heroIndex]);h.hname=t.value.slice(0,16);pp.heroes[pp.heroIndex]=h;save();}}
function onInput(e){var t=e.target;if(!t.getAttribute)return;if(t.getAttribute("data-act")==="newname")S.newName=t.value;}

/* ===================== PWA ICON / MANIFEST ===================== */
function setupPWA(){try{var mn={name:"Maths Minutes",short_name:"Maths",start_url:".",display:"standalone",background_color:"#FFF7EC",theme_color:"#0E9384",icons:[{src:"icon-192.png",sizes:"192x192",type:"image/png"},{src:"icon-512.png",sizes:"512x512",type:"image/png"}]};var b=new Blob([JSON.stringify(mn)],{type:"application/json"});var ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(b);document.head.appendChild(ml);}catch(e){}}

/* ===================== INIT ===================== */
function showBootError(e){try{var app=document.getElementById("app");if(app&&(!app.innerHTML||app.innerHTML.replace(/\s/g,"").length<20)){var msg=(e&&e.message)?e.message:String(e);var stack=(e&&e.stack)?String(e.stack).slice(0,400):"";app.innerHTML='<div style="max-width:560px;margin:0 auto;padding:24px;font-family:sans-serif;color:#26302f"><div style="font-size:40px;text-align:center">\uD83D\uDD27</div><h2 style="text-align:center">The app hit a snag starting up</h2><p style="text-align:center;color:#7c8a87">Please screenshot this and send it to Dad so he can fix it.</p><pre style="white-space:pre-wrap;background:#fff;border:1px solid #ece3d4;border-radius:12px;padding:12px;font-size:12px;color:#b3261e">'+msg+(stack?("\n\n"+stack):"")+'</pre><button onclick="location.reload()" style="display:block;margin:14px auto 0;padding:12px 20px;border:0;border-radius:12px;background:#0E9384;color:#fff;font-weight:800;font-size:16px">Try again</button></div>';}}catch(_){}}
window.onerror=function(m,src,ln,col,err){showBootError(err||m);};
try{
 document.getElementById("app").addEventListener("click",onClick);
 document.addEventListener("change",onChange);
 document.addEventListener("input",onInput);
 try{setupPWA();}catch(e){}
 render();
}catch(e){showBootError(e);}
function startSync(tries){try{if(typeof firebase!=="undefined"){initSync();if(PULL_QUEUED)syncPull();return;}}catch(e){}if((tries||0)<60)setTimeout(function(){startSync((tries||0)+1);},150);}
startSync(0);
try{document.addEventListener("visibilitychange",function(){if(!document.hidden)syncPull();});}catch(e){}
try{window.addEventListener("focus",syncPull);window.addEventListener("pageshow",syncPull);}catch(e){}
</script>
